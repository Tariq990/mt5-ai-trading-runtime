[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpttradder"
version = "0.4.0"
description = "Demo-only multi-asset trading automation orchestrator with external ChatGPT decision bridge."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  # Windows lacks a system IANA timezone database; ZoneInfo needs this.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.6,<1"]
mt5 = ["MetaTrader5>=5.0.45"]

[project.scripts]
gpttradder = "gpttradder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
"gpttradder.assets" = ["bridge/*.mjs", "bridge/package.json", "prompts/*.md"]
