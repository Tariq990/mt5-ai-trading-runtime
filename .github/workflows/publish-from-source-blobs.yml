          python - <<'PY'
          import os, shutil
          for name in os.listdir('.'):
              if name == '.git':
                  continue
              p = os.path.join('.', name)
              if os.path.isdir(p) and not os.path.islink(p):
                  shutil.rmtree(p)
              else:
                  os.remove(p)
          PY

          while IFS='|' read -r path sha; do
            mkdir -p "$(dirname "$path")"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$path"
            actual=$(git hash-object "$path")
            test "$actual" = "$sha" || { echo "SHA mismatch: $path $actual != $sha"; exit 1; }
          done < /tmp/files.tsv

          test "$(git ls-files --others --exclude-standard | wc -l)" -ge 1
          echo "Reconstructed and verified 69 source files."

      - name: Python verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pytest -q
          python -m compileall -q src tests
          gpttradder smoke --mock-decision

      - name: Node bridge verification
        shell: bash
        run: |
          set -euo pipefail
          node --check bridge/server.mjs
          node --test bridge/json.test.mjs bridge/sdk-loader.test.mjs

      - name: Publish verified tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "publish GPTTRADDER 0.3.0"
          git push origin HEAD:main
