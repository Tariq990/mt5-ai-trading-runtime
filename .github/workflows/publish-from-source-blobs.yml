name: Publish GPTTRADDER 0.3.0 from source blobs

on:
  push:
    branches:
      - agent/publish-0.3.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact audited source tree
